name: Member accounts

# One stack per directory under accounts/, each applied from inside its own
# account with the roles modules/member-baseline creates there. Same flow as
# terraform.yml: plan every push, apply master's saved plan after approval.

on:
  push:
    branches: ["**"]

permissions:
  id-token: write
  contents: read

jobs:
  # Every accounts/<name> with an account_id in its terraform.tfvars.json. An
  # empty one means the account hasn't been bootstrapped yet (see README).
  discover:
    runs-on: ubuntu-latest
    outputs:
      accounts: ${{ steps.list.outputs.accounts }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        run: |
          accounts="$(
            for dir in accounts/*/; do
              name="$(basename "$dir")"
              id="$(jq -r '.account_id // ""' "$dir/terraform.tfvars.json")"
              if [ -n "$id" ]; then
                jq -cn --arg name "$name" --arg id "$id" \
                  '{name: $name, id: $id, secret: ("MEMBER_TFVARS_" + ($name | ascii_upcase | gsub("-"; "_")))}'
              fi
            done | jq -cs .
          )"
          echo "accounts=$accounts" >> "$GITHUB_OUTPUT"

  plan:
    needs: discover
    if: needs.discover.outputs.accounts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(needs.discover.outputs.accounts) }}
    defaults:
      run:
        working-directory: accounts/${{ matrix.account.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account.id }}:role/terraform-aws-accounts-plan
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4

      # Variables kept out of the repo, as a JSON tfvars blob per account. Like
      # TF_VAR_personal_domain_name in terraform.yml, only plan needs them:
      # the saved plan carries them into apply.
      - name: Write secret variables
        env:
          TFVARS: ${{ secrets[matrix.account.secret] }}
        run: |
          if [ -n "$TFVARS" ]; then
            printf '%s' "$TFVARS" > secrets.auto.tfvars.json
          fi

      - run: terraform init -input=false

      - id: plan
        run: |
          ec=0
          terraform plan -input=false -detailed-exitcode -out=tfplan || ec=$?
          [ "$ec" -eq 1 ] && exit 1
          echo "has_changes=$([ "$ec" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The artifact's presence is what tells apply this account has changes:
      # matrix jobs can't each set their own job output.
      - if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ matrix.account.name }}
          path: accounts/${{ matrix.account.name }}/tfplan
          retention-days: 1

  # Narrows the account list to the ones whose plan has changes, so apply
  # doesn't ask for approval of no-ops.
  changed:
    needs: [discover, plan]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      accounts: ${{ steps.filter.outputs.accounts }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tfplan-*
          path: plans

      - id: filter
        env:
          ACCOUNTS: ${{ needs.discover.outputs.accounts }}
        run: |
          changed="$( (ls plans 2>/dev/null || true) | sed 's/^tfplan-//' | jq -R . | jq -cs .)"
          accounts="$(jq -c --argjson changed "$changed" 'map(select(.name as $n | $changed | index($n)))' <<<"$ACCOUNTS")"
          echo "accounts=$accounts" >> "$GITHUB_OUTPUT"

  apply:
    needs: changed
    if: needs.changed.outputs.accounts != '[]'
    runs-on: ubuntu-latest
    # Same environment as terraform.yml's apply, and the one the baseline's
    # terraform-aws-accounts role trusts.
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(needs.changed.outputs.accounts) }}
    defaults:
      run:
        working-directory: accounts/${{ matrix.account.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account.id }}:role/terraform-aws-accounts
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init -input=false

      - uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ matrix.account.name }}
          path: accounts/${{ matrix.account.name }}

      - run: terraform apply -input=false tfplan
