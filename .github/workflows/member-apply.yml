name: Member account apply

# Called from terraform.yml once per member account, after its plan and
# apply-management: applies the saved plan from member-plan.yml, from inside
# the account with the role modules/member-baseline creates there.

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      account_id:
        type: string
        required: true

jobs:
  apply:
    runs-on: ubuntu-latest
    # Same approval gate as apply-management, and the environment the
    # baseline's terraform-aws-accounts role trusts.
    environment: prod
    defaults:
      run:
        working-directory: accounts/${{ inputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.account_id }}:role/terraform-aws-accounts
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - run: terraform init -input=false

      - uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ inputs.name }}
          path: accounts/${{ inputs.name }}

      - run: terraform apply -input=false tfplan
