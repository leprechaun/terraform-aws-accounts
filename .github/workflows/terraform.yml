name: Terraform

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  # No local AWS profile in CI — credentials come from the OIDC-assumed
  # role via aws-actions/configure-aws-credentials below.
  TF_VAR_aws_profile: ""
  TF_VAR_owner_account_id: ${{ vars.OWNER_ACCOUNT_ID }}
  TF_VAR_existing_account_id: ${{ vars.EXISTING_ACCOUNT_ID }}
  TF_VAR_existing_account_email: ${{ vars.EXISTING_ACCOUNT_EMAIL }}
  TF_VAR_existing_account_name: ${{ vars.EXISTING_ACCOUNT_NAME }}
  TF_VAR_snacker_tracker_account_name: ${{ vars.SNACKER_TRACKER_ACCOUNT_NAME }}
  TF_VAR_snacker_tracker_account_email: ${{ vars.SNACKER_TRACKER_ACCOUNT_EMAIL }}
  TF_VAR_krapao_reviews_account_name: ${{ vars.KRAPAO_REVIEWS_ACCOUNT_NAME }}
  TF_VAR_krapao_reviews_account_email: ${{ vars.KRAPAO_REVIEWS_ACCOUNT_EMAIL }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: true

      - run: terraform init -input=false

      - id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - uses: actions/github-script@v7
        with:
          script: |
            const body = `#### Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.slice(0, 65000),
            });

      - if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Configure this environment in GitHub repo Settings > Environments with
    # required reviewers, so apply pauses for manual approval before running.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -input=false

      - run: terraform apply -auto-approve -input=false
