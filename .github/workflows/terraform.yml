name: Terraform

on:
  push:
    branches: ["**"]

permissions:
  id-token: write
  contents: read

# Every stack in this repo: the management stack (the repo root) first,
# then one per member account under accounts/, in parallel with each other.
# Each stack gets a plan job and an apply job:
#
#   plan-management -> apply-management -+-> plan-lmac-sh -> apply-lmac-sh
#                                        +-> plan-<name>  -> apply-<name>
#
# Plans run on every push, to every branch, unattended, and save the plan;
# applies only run on master when that plan has changes, behind approval,
# and apply exactly the saved plan, so what a reviewer approves is what gets
# applied. Member plans wait for the management apply (or for it to be
# skipped), since member stacks rely on things it owns. Anything failing
# stops everything after it.
#
# Each member stack runs from inside its own account, with the roles
# modules/member-baseline creates there, so a new account's first apply is
# local (see README) and its jobs only get added here after that.
#
# The management stack's role ARNs stay repo variables since those roles
# don't exist until the first local apply (see README).

jobs:
  plan-management:
    runs-on: ubuntu-latest
    # Only plan needs this: apply runs the saved plan, which already has
    # variable values baked in.
    env:
      TF_VAR_personal_domain_name: ${{ secrets.PERSONAL_DOMAIN_NAME }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v4
        with:
          # The default wrapper turns terraform's exit code 2 (plan has
          # changes, from -detailed-exitcode) into 0, so has_changes below
          # would always be false and apply always skipped.
          terraform_wrapper: false

      - run: terraform init -input=false

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present.
      # A no-op plan skips apply entirely, so there's no approval prompt for
      # a run that would do nothing.
      - id: plan
        run: |
          ec=0
          terraform plan -input=false -detailed-exitcode -out=tfplan || ec=$?
          [ "$ec" -eq 1 ] && exit 1
          echo "has_changes=$([ "$ec" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Only master's ever gets applied; every other branch's just expires.
      - if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-management
          path: tfplan
          retention-days: 1

  apply-management:
    needs: plan-management
    if: github.ref == 'refs/heads/master' && needs.plan-management.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Configure this environment in GitHub repo Settings > Environments with
    # required reviewers, so applies pause for manual approval. It's also what
    # every apply role, management and member, trusts.
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - run: terraform init -input=false

      - uses: actions/download-artifact@v8
        with:
          name: tfplan-management

      - run: terraform apply -input=false tfplan

  # Member accounts. Each plan job needs apply-management (not another
  # member's jobs, so accounts run in parallel), and runs whether that apply
  # ran or was skipped (no changes, or not master), but not if anything
  # before it failed: failure() covers every ancestor.

  plan-lmac-sh:
    needs: apply-management
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: accounts/lmac-sh
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::167340562062:role/terraform-aws-accounts-plan
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # Variables kept out of the repo, as a JSON tfvars blob.
      - env:
          TFVARS: ${{ secrets.MEMBER_TFVARS_LMAC_SH }}
        run: printf '%s' "$TFVARS" > secrets.auto.tfvars.json

      - run: terraform init -input=false

      - id: plan
        run: |
          ec=0
          terraform plan -input=false -detailed-exitcode -out=tfplan || ec=$?
          [ "$ec" -eq 1 ] && exit 1
          echo "has_changes=$([ "$ec" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-lmac-sh
          path: accounts/lmac-sh/tfplan
          retention-days: 1

  apply-lmac-sh:
    needs: plan-lmac-sh
    if: >-
      !failure() && !cancelled()
      && github.ref == 'refs/heads/master'
      && needs.plan-lmac-sh.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: accounts/lmac-sh
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::167340562062:role/terraform-aws-accounts
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - run: terraform init -input=false

      - uses: actions/download-artifact@v8
        with:
          name: tfplan-lmac-sh
          path: accounts/lmac-sh

      - run: terraform apply -input=false tfplan

  # snacker-tracker, in bootstrap mode: its own CI roles don't exist yet, so
  # both jobs run as the management apply role (master only, behind
  # approval), with -var bootstrap=true making the stack assume
  # OrganizationAccountAccessRole. Once this has applied, swap in the regular
  # jobs (copy lmac-sh's). The same swap the other way is how to recover an
  # account whose CI roles are broken.
  plan-snacker-tracker:
    needs: apply-management
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: accounts/snacker-tracker
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - run: terraform init -input=false

      - id: plan
        run: |
          ec=0
          terraform plan -input=false -detailed-exitcode -var bootstrap=true -out=tfplan || ec=$?
          [ "$ec" -eq 1 ] && exit 1
          echo "has_changes=$([ "$ec" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-snacker-tracker
          path: accounts/snacker-tracker/tfplan
          retention-days: 1

  apply-snacker-tracker:
    needs: plan-snacker-tracker
    if: >-
      !failure() && !cancelled()
      && github.ref == 'refs/heads/master'
      && needs.plan-snacker-tracker.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: accounts/snacker-tracker
    steps:
      - uses: actions/checkout@v7

      # Same role as the plan job: the saved plan has bootstrap = true baked
      # in, so its provider assumes OrganizationAccountAccessRole again.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - run: terraform init -input=false

      - uses: actions/download-artifact@v8
        with:
          name: tfplan-snacker-tracker
          path: accounts/snacker-tracker

      - run: terraform apply -input=false tfplan
