name: Terraform

on:
  push:
    branches: ["**"]

permissions:
  id-token: write
  contents: read

# terraform.tfvars is committed, so no TF_VAR_* plumbing is needed here —
# only the deploy role ARN, which stays a repo variable since the OIDC role
# doesn't exist until the first local apply (see README).
#
# Two kinds of stack: the management stack (the repo root), and one per
# member account under accounts/, each applied from inside its own account
# with the roles modules/member-baseline creates there. On master, the member
# applies wait for the management apply, since member stacks rely on things
# it owns (e.g. the state bucket policy).

jobs:
  # Runs on every push, to every branch, unattended (no environment gate) —
  # this is what fixes the plan that apply below will actually run, so what
  # a reviewer approves is exactly what gets applied, not a fresh plan
  # computed at approval time (which could've drifted in between). Only
  # master's plan artifact ever gets consumed by apply; every other
  # branch's just expires unused after a day.
  plan-management:
    runs-on: ubuntu-latest
    # Only plan needs this — apply downloads and applies the exact saved
    # plan file below, which already has variable values baked in, so it
    # never touches this secret at all.
    env:
      TF_VAR_personal_domain_name: ${{ secrets.PERSONAL_DOMAIN_NAME }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init -input=false

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present.
      # A no-op plan skips apply entirely, so there's no prod approval
      # prompt (or its notification) for a run that would do nothing.
      - id: plan
        run: |
          ec=0
          terraform plan -input=false -detailed-exitcode -out=tfplan || ec=$?
          [ "$ec" -eq 1 ] && exit 1
          echo "has_changes=$([ "$ec" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply-management:
    needs: plan-management
    if: github.ref == 'refs/heads/master' && needs.plan-management.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Configure this environment in GitHub repo Settings > Environments with
    # required reviewers, so apply pauses for manual approval before running.
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init -input=false

      - uses: actions/download-artifact@v8
        with:
          name: tfplan

      - run: terraform apply -input=false tfplan

  # One plan/apply pair per member account (accounts/<name>), via the
  # reusable member-plan.yml and member-apply.yml. Plans run alongside
  # plan-management; applies wait for apply-management, or for it to be
  # skipped as a no-op. failure() covers every ancestor, so a failed
  # management plan or apply stops them too. Plan after apply-management
  # instead once a member stack reads the management stack's state.
  #
  # Add an account's pair only after its local bootstrap (see README),
  # since these log in with roles that bootstrap creates.

  # lmac-sh: uncomment with its ID (management output lmac_sh_account_id)
  # once bootstrapped.
  #
  # plan-lmac-sh:
  #   uses: ./.github/workflows/member-plan.yml
  #   with:
  #     name: lmac-sh
  #     account_id: "<lmac_sh_account_id>"
  #   secrets:
  #     tfvars: ${{ secrets.MEMBER_TFVARS_LMAC_SH }}
  #
  # apply-lmac-sh:
  #   needs: [apply-management, plan-lmac-sh]
  #   if: >-
  #     !failure() && !cancelled()
  #     && github.ref == 'refs/heads/master'
  #     && needs.plan-lmac-sh.outputs.has_changes == 'true'
  #   uses: ./.github/workflows/member-apply.yml
  #   with:
  #     name: lmac-sh
  #     account_id: "<lmac_sh_account_id>"
