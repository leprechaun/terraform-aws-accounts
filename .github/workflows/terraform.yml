name: Terraform

on:
  push:
    branches: ["**"]

permissions:
  id-token: write
  contents: read

# terraform.tfvars is committed, so no TF_VAR_* plumbing is needed here —
# only the deploy role ARN, which stays a repo variable since the OIDC role
# doesn't exist until the first local apply (see README).

jobs:
  # Runs on every push, to every branch, unattended (no environment gate) —
  # this is what fixes the plan that apply below will actually run, so what
  # a reviewer approves is exactly what gets applied, not a fresh plan
  # computed at approval time (which could've drifted in between). Only
  # master's plan artifact ever gets consumed by apply; every other
  # branch's just expires unused after a day.
  plan:
    runs-on: ubuntu-latest
    # Only plan needs this — apply downloads and applies the exact saved
    # plan file below, which already has variable values baked in, so it
    # never touches this secret at all.
    env:
      TF_VAR_personal_domain_name: ${{ secrets.PERSONAL_DOMAIN_NAME }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init -input=false

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present.
      # A no-op plan skips apply entirely, so there's no prod approval
      # prompt (or its notification) for a run that would do nothing.
      - id: plan
        run: |
          ec=0
          terraform plan -input=false -detailed-exitcode -out=tfplan || ec=$?
          [ "$ec" -eq 1 ] && exit 1
          echo "has_changes=$([ "$ec" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    needs: plan
    if: github.ref == 'refs/heads/master' && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Configure this environment in GitHub repo Settings > Environments with
    # required reviewers, so apply pauses for manual approval before running.
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init -input=false

      - uses: actions/download-artifact@v8
        with:
          name: tfplan

      - run: terraform apply -input=false tfplan
