name: Terraform

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read
  pull-requests: write

# terraform.tfvars is committed, so no TF_VAR_* plumbing is needed here —
# only the deploy role ARN, which stays a repo variable since the OIDC role
# doesn't exist until the first local apply (see README).

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # TEMPORARY — remove once the OIDC assume-role issue is diagnosed.
      # Prints exactly what GitHub actually puts in the token for this run,
      # so we're comparing against reality instead of assumptions.
      - name: Debug OIDC claims
        uses: actions/github-script@v9
        with:
          script: |
            const id_token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(id_token.split('.')[1], 'base64').toString());
            core.info(`aud: ${payload.aud}`);
            core.info(`sub: ${payload.sub}`);
            core.info(`repository: ${payload.repository}`);
            core.info(`repository_owner: ${payload.repository_owner}`);
            core.info(`event_name: ${payload.event_name}`);
            core.info(`ref: ${payload.ref}`);
            core.info(`environment: ${payload.environment}`);

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: true

      - run: terraform init -input=false

      - id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - uses: actions/github-script@v9
        with:
          script: |
            const body = `#### Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.slice(0, 65000),
            });

      - if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Configure this environment in GitHub repo Settings > Environments with
    # required reviewers, so apply pauses for manual approval before running.
    environment: production
    steps:
      - uses: actions/checkout@v7

      # TEMPORARY — remove once the OIDC assume-role issue is diagnosed.
      # Prints exactly what GitHub actually puts in the token for this run,
      # so we're comparing against reality instead of assumptions.
      - name: Debug OIDC claims
        uses: actions/github-script@v9
        with:
          script: |
            const id_token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(id_token.split('.')[1], 'base64').toString());
            core.info(`aud: ${payload.aud}`);
            core.info(`sub: ${payload.sub}`);
            core.info(`repository: ${payload.repository}`);
            core.info(`repository_owner: ${payload.repository_owner}`);
            core.info(`event_name: ${payload.event_name}`);
            core.info(`ref: ${payload.ref}`);
            core.info(`environment: ${payload.environment}`);

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init -input=false

      - run: terraform apply -auto-approve -input=false
